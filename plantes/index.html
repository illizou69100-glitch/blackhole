<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Plantes</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plantes">
<meta name="theme-color" content="#0c110d">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c110d; --surf:#151b16; --surf2:#1d251f; --line:rgba(255,255,255,.08);
  --text:#eaf2ec; --dim:#7d8c81;
  --leaf:#5fd68a; --soon:#e0b25c; --late:#f0776a; --info:#6fb6e8;
}
html,body{
  height:100%;height:-webkit-fill-available;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font-family:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}

.view{position:fixed;inset:0;display:flex;flex-direction:column;
  padding-top:max(env(safe-area-inset-top),44px);
  padding-bottom:calc(60px + max(env(safe-area-inset-bottom),10px));}
.view.hidden{display:none}
.vhdr{padding:2px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
.vhdr h1{font-size:27px;font-weight:800;letter-spacing:-.02em}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 20px}
.ibtn{background:var(--surf);border:none;color:var(--dim);width:36px;height:36px;border-radius:11px;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:background .15s}
.ibtn:active{background:var(--surf2)}
.ibtn svg{width:19px;height:19px}

/* Onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(12,17,13,.94);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  border-top:1px solid var(--line);padding-bottom:max(env(safe-area-inset-bottom),8px)}
.tab{background:none;border:none;color:var(--dim);padding:9px 0 5px;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:10px;font-weight:700;transition:color .18s}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--leaf)}
.tab:active{opacity:.6}

/* Bandeau « à arroser » */
.due-band{margin:0 16px 14px;background:linear-gradient(135deg,rgba(224,178,92,.16),rgba(224,178,92,.06));
  border:1px solid rgba(224,178,92,.28);border-radius:16px;padding:14px 16px;flex-shrink:0}
.due-band.none{background:var(--surf);border-color:var(--line)}
.due-t{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.due-s{font-size:12px;color:var(--dim);margin-top:4px}

/* Carte plante */
.pcard{display:flex;gap:13px;background:var(--surf);border:1px solid var(--line);border-radius:18px;
  padding:11px;margin-bottom:10px;align-items:center;transition:background .15s;animation:cardIn .32s cubic-bezier(.22,1,.36,1) backwards}
.pcard:active{background:var(--surf2);transform:scale(.99)}
.pthumb{width:62px;height:62px;border-radius:14px;object-fit:cover;flex-shrink:0;background:var(--surf2);
  display:flex;align-items:center;justify-content:center;font-size:26px}
.pbody{flex:1;min-width:0}
.pname{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pspec{font-size:12px;color:var(--dim);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pwater{font-size:12.5px;font-weight:700;margin-top:6px;display:flex;align-items:center;gap:6px}
.pwater.ok{color:var(--dim)} .pwater.soon{color:var(--soon)} .pwater.late{color:var(--late)}
.wbtn{flex-shrink:0;width:44px;height:44px;border-radius:50%;border:1.5px solid rgba(111,182,232,.4);
  background:rgba(111,182,232,.12);color:var(--info);font-size:19px;display:flex;align-items:center;justify-content:center}
.wbtn:active{transform:scale(.9)}
.wbtn.done{border-color:rgba(95,214,138,.5);background:rgba(95,214,138,.16);color:var(--leaf)}

.fab{position:fixed;right:18px;bottom:calc(72px + max(env(safe-area-inset-bottom),10px));z-index:45;
  width:54px;height:54px;border-radius:50%;border:none;background:var(--leaf);color:#0c110d;
  font-size:30px;font-weight:300;line-height:1;box-shadow:0 8px 26px rgba(95,214,138,.3);
  display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.92)}
.empty{text-align:center;color:var(--dim);padding:48px 26px;font-size:14px;line-height:1.65}

/* Identification */
.shot{width:100%;aspect-ratio:1;border-radius:20px;background:var(--surf);border:1.5px dashed rgba(255,255,255,.14);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--dim);
  overflow:hidden;position:relative}
.shot img{width:100%;height:100%;object-fit:cover}
.shot-ico{font-size:44px}
.organ-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.organ{padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surf);
  color:var(--dim);font-size:12px;font-weight:700;transition:all .18s}
.organ.sel{background:var(--leaf);border-color:var(--leaf);color:#0c110d}
.res{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:9px;
  animation:cardIn .3s cubic-bezier(.22,1,.36,1) backwards}
.res-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.res-n{font-size:16px;font-weight:700}
.res-l{font-size:12.5px;color:var(--dim);font-style:italic;margin-top:2px}
.res-p{font-size:13px;font-weight:800;flex-shrink:0}
.res-bar{height:5px;border-radius:5px;background:rgba(255,255,255,.08);margin-top:9px;overflow:hidden}
.res-fill{height:100%;background:var(--leaf);border-radius:5px;transition:width .5s cubic-bezier(.22,1,.36,1)}
.spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.14);border-top-color:var(--leaf);
  border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* Fiches */
.srch{width:100%;background:var(--surf);border:1px solid var(--line);color:var(--text);
  padding:12px 14px;border-radius:13px;font-size:15px;font-family:inherit;margin-bottom:12px}
.fcard{display:flex;gap:12px;align-items:center;background:var(--surf);border-radius:15px;padding:13px 14px;margin-bottom:8px}
.fcard:active{background:var(--surf2)}
.femoji{font-size:25px;flex-shrink:0;width:32px;text-align:center}
.fname{font-size:15.5px;font-weight:700}
.flat{font-size:12px;color:var(--dim);font-style:italic;margin-top:1px}
.fmeta{font-size:11.5px;color:var(--dim);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.07);color:var(--dim)}
.badge.tox{background:rgba(240,119,106,.16);color:var(--late)}
.badge.easy{background:rgba(95,214,138,.16);color:var(--leaf)}

/* Réglages */
.slbl{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;padding:20px 4px 9px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surf);
  padding:13px 15px;border-radius:13px;margin-bottom:7px}
.srow-l{font-size:14.5px}
.srow-s{font-size:11.5px;color:var(--dim);margin-top:3px;line-height:1.45}
.sw{position:relative;width:48px;height:29px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sl{position:absolute;inset:0;background:#3a453c;border-radius:29px;transition:.25s}
.sl::before{content:'';position:absolute;height:23px;width:23px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.25s}
.sw input:checked + .sl{background:var(--leaf)}
.sw input:checked + .sl::before{transform:translateX(19px)}
.btnw{width:100%;padding:14px;border:none;border-radius:13px;font-size:15px;font-weight:700;margin-top:7px}
.btn-n{background:var(--surf2);color:var(--text)}
.btn-g{background:var(--leaf);color:#0c110d}
.btn-d{background:rgba(240,119,106,.14);color:var(--late)}
.note{font-size:12.5px;color:var(--dim);line-height:1.6;background:var(--surf);border-radius:13px;padding:13px 15px;margin-top:8px}
.note strong{color:var(--text)}

/* Feuilles */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:90;opacity:0;pointer-events:none;
  transition:opacity .28s;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:100;background:#171e18;border-radius:24px 24px 0 0;
  padding:9px 18px calc(20px + max(env(safe-area-inset-bottom),10px));transform:translateY(102%);
  transition:transform .33s cubic-bezier(.32,.72,0,1);max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:4px;background:#3a453c;margin:0 auto 16px}
.sh-t{font-size:19px;font-weight:800;margin-bottom:4px}
.sh-sub{font-size:13px;color:var(--dim);font-style:italic;margin-bottom:16px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11.5px;color:var(--dim);margin-bottom:6px;font-weight:600}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld textarea,.fld select{
  width:100%;background:var(--surf2);border:1px solid var(--line);color:var(--text);
  padding:12px 13px;border-radius:11px;font-size:15.5px;font-family:inherit}
.fld textarea{min-height:64px;resize:vertical;line-height:1.45}
.fld-row{display:flex;gap:10px}.fld-row .fld{flex:1}
.sh-photo{width:100%;aspect-ratio:16/10;border-radius:16px;object-fit:cover;background:var(--surf2);margin-bottom:13px;
  display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:34px}
.acts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.care-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:4px 0 12px}
.care-i{background:var(--surf2);border-radius:13px;padding:12px}
.care-k{font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.care-v{font-size:14px;font-weight:600;margin-top:4px;line-height:1.35}
.jrow{display:flex;gap:11px;align-items:center;background:var(--surf2);border-radius:11px;padding:10px 12px;margin-bottom:6px}
.jico{font-size:17px;flex-shrink:0}
.jtxt{flex:1;font-size:13.5px}
.jdate{font-size:11.5px;color:var(--dim);flex-shrink:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + max(env(safe-area-inset-bottom),10px));
  z-index:200;background:var(--surf2);border:1px solid var(--line);color:var(--text);padding:11px 20px;
  border-radius:13px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;
  transition:opacity .25s,bottom .25s;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;bottom:calc(94px + max(env(safe-area-inset-bottom),10px))}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- MES PLANTES -->
<div class="view" id="vPlants">
  <div class="vhdr"><h1>Mes plantes</h1>
    <button class="ibtn" id="sortBtn" aria-label="Trier">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M6 12h12M10 18h4"/></svg>
    </button>
  </div>
  <div class="due-band" id="dueBand"></div>
  <div class="scroll" id="plantScroll"></div>
  <button class="fab" id="addPlantBtn" aria-label="Ajouter">+</button>
</div>

<!-- IDENTIFIER -->
<div class="view hidden" id="vId">
  <div class="vhdr"><h1>Identifier</h1></div>
  <div class="scroll">
    <button class="shot" id="shotBox">
      <span class="shot-ico">&#128247;</span>
      <span style="font-size:14px;font-weight:600">Prendre ou choisir une photo</span>
      <span style="font-size:12px">Cadre bien l'organe (feuille, fleur&#8230;)</span>
    </button>
    <input type="file" id="shotFile" accept="image/*" style="display:none">
    <div class="organ-row" id="organRow"></div>
    <button class="btnw btn-g" id="idBtn" style="margin-top:14px">Identifier cette plante</button>
    <div id="idOut" style="margin-top:16px"></div>
  </div>
</div>

<!-- FICHES -->
<div class="view hidden" id="vCare">
  <div class="vhdr"><h1>Fiches</h1></div>
  <div class="scroll">
    <input type="text" class="srch" id="careSearch" placeholder="Chercher une plante&#8230;">
    <div id="careList"></div>
  </div>
</div>

<!-- RÉGLAGES -->
<div class="view hidden" id="vSet">
  <div class="vhdr"><h1>R&#233;glages</h1></div>
  <div class="scroll" id="setScroll"></div>
</div>

<nav class="tabbar">
  <button class="tab on" data-v="vPlants">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c0-6 4-10 9-10-1 6-4 10-9 10z"/><path d="M12 22C12 14 8 9 3 9c1 7 4 13 9 13z"/></svg>
    <span>Mes plantes</span></button>
  <button class="tab" data-v="vId">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
    <span>Identifier</span></button>
  <button class="tab" data-v="vCare">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
    <span>Fiches</span></button>
  <button class="tab" data-v="vSet">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V10a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>R&#233;glages</span></button>
</nav>

<div id="backdrop"></div>

<div class="sheet" id="plantSheet">
  <div class="grab"></div>
  <div id="plantSheetBody"></div>
</div>
<div class="sheet" id="careSheet">
  <div class="grab"></div>
  <div id="careSheetBody"></div>
</div>

<input type="file" id="plantPhotoFile" accept="image/*" style="display:none">
<div class="toast" id="toast"></div>

<script>
/* ══════════ Fiches d'entretien ══════════
   Base embarquee : l'app doit rester utile sans reseau. `genus` sert a
   raccrocher un resultat d'identification a la bonne fiche. */
const CARE = [
  {g:'Monstera',n:'Monstera',lat:'Monstera deliciosa',e:'🌿',light:'Lumière vive indirecte',water:7,winter:12,hum:'Moyenne à élevée',temp:'18-27 °C',tox:1,diff:'Facile',tip:"Essuie les feuilles, elle respire mieux. Tuteur si elle penche."},
  {g:'Ficus',n:'Ficus lyrata',lat:'Ficus lyrata',e:'🌳',light:'Lumière vive indirecte',water:7,winter:12,hum:'Moyenne',temp:'18-24 °C',tox:1,diff:'Difficile',tip:"Déteste être déplacé. Trouve-lui une place et n'y touche plus."},
  {g:'Ficus',n:'Ficus elastica',lat:'Ficus elastica',e:'🌱',light:'Lumière vive indirecte',water:8,winter:14,hum:'Moyenne',temp:'16-24 °C',tox:1,diff:'Facile',tip:"Laisse sécher les 3 premiers cm avant d'arroser."},
  {g:'Sansevieria',n:'Sansevieria',lat:'Dracaena trifasciata',e:'🗡',light:"Tolère tout, même l'ombre",water:18,winter:30,hum:'Faible',temp:'15-27 °C',tox:1,diff:'Très facile',tip:"La tuer, c'est l'arroser trop. En cas de doute, n'arrose pas."},
  {g:'Zamioculcas',n:'ZZ plant',lat:'Zamioculcas zamiifolia',e:'🌿',light:'Faible à moyenne',water:18,winter:28,hum:'Faible',temp:'15-26 °C',tox:1,diff:'Très facile',tip:"Ses rhizomes stockent l'eau : elle pardonne les oublis, pas les excès."},
  {g:'Epipremnum',n:'Pothos',lat:'Epipremnum aureum',e:'🍃',light:'Moyenne, tolère le faible',water:8,winter:12,hum:'Moyenne',temp:'17-27 °C',tox:1,diff:'Très facile',tip:"Bouture dans l'eau : ça marche à tous les coups."},
  {g:'Spathiphyllum',n:'Spathiphyllum',lat:'Spathiphyllum wallisii',e:'🤍',light:'Moyenne à faible',water:5,winter:8,hum:'Élevée',temp:'18-25 °C',tox:1,diff:'Facile',tip:"Elle s'affaisse quand elle a soif, et repart en une heure après l'arrosage."},
  {g:'Chlorophytum',n:'Plante araignée',lat:'Chlorophytum comosum',e:'🕷',light:'Vive indirecte',water:7,winter:11,hum:'Moyenne',temp:'15-25 °C',tox:0,diff:'Très facile',tip:"Pointes brunes = eau trop calcaire. Passe à l'eau filtrée."},
  {g:'Dracaena',n:'Dracaena',lat:'Dracaena marginata',e:'🌴',light:'Moyenne à vive indirecte',water:12,winter:18,hum:'Moyenne',temp:'18-26 °C',tox:1,diff:'Facile',tip:"Sensible au fluor de l'eau du robinet. Laisse reposer l'eau 24 h."},
  {g:'Aloe',n:'Aloe vera',lat:'Aloe barbadensis',e:'🌵',light:'Plein soleil à vive',water:18,winter:30,hum:'Faible',temp:'15-27 °C',tox:1,diff:'Très facile',tip:"Terreau de cactus obligatoire, et un pot percé."},
  {g:'Crassula',n:'Arbre de jade',lat:'Crassula ovata',e:'💎',light:'Vive, un peu de soleil direct',water:16,winter:28,hum:'Faible',temp:'15-24 °C',tox:1,diff:'Facile',tip:"Feuilles ridées = elle a soif. Feuilles molles = trop d'eau."},
  {g:'Echeveria',n:'Echeveria',lat:'Echeveria elegans',e:'🌸',light:'Plein soleil',water:14,winter:25,hum:'Faible',temp:'15-25 °C',tox:0,diff:'Facile',tip:"Arrose au pied, jamais sur la rosette : elle pourrit."},
  {g:'Calathea',n:'Calathea',lat:'Calathea orbifolia',e:'🎋',light:'Moyenne indirecte, jamais direct',water:5,winter:8,hum:'Très élevée',temp:'18-26 °C',tox:0,diff:'Difficile',tip:"Eau non calcaire et humidité élevée, sinon les bords brunissent."},
  {g:'Maranta',n:'Maranta',lat:'Maranta leuconeura',e:'🙏',light:'Moyenne indirecte',water:5,winter:8,hum:'Élevée',temp:'18-26 °C',tox:0,diff:'Moyenne',tip:"Elle replie ses feuilles la nuit, c'est normal et bon signe."},
  {g:'Philodendron',n:'Philodendron',lat:'Philodendron hederaceum',e:'💚',light:'Moyenne à vive indirecte',water:8,winter:12,hum:'Moyenne',temp:'18-27 °C',tox:1,diff:'Très facile',tip:"Pince les tiges pour la rendre plus touffue."},

/* ══════════ Stockage ══════════
   Les photos vivent dans IndexedDB : le quota de localStorage (~5 Mo)
   serait sature en une dizaine de cliches. */
const DBN='plantes_db', STORE='plants';
let idb=null;
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DBN,1);
    r.onupgradeneeded=e=>{ const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE,{keyPath:'id'}); };
    r.onsuccess=e=>{ idb=e.target.result; res(idb); };
    r.onerror=()=>rej(r.error);
  });
}
function tx(mode){ return idb.transaction(STORE,mode).objectStore(STORE); }
function dbAll(){ return new Promise(r=>{ const q=tx('readonly').getAll(); q.onsuccess=()=>r(q.result||[]); q.onerror=()=>r([]); }); }
function dbPut(p){ return new Promise(r=>{ const q=tx('readwrite').put(p); q.onsuccess=()=>r(true); q.onerror=()=>r(false); }); }
function dbDel(id){ return new Promise(r=>{ const q=tx('readwrite').delete(id); q.onsuccess=()=>r(true); q.onerror=()=>r(false); }); }

const SK='plantes_set';
let SET=JSON.parse(localStorage.getItem(SK)||'null')||{plantnetKey:'',notify:false,sort:'water'};
function saveSet(){ localStorage.setItem(SK,JSON.stringify(SET)); }

const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const DAY=86400000;
function dayKey(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function today(){return dayKey(Date.now());}

let toastT=null;
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2400);}

/* ══════════ Arrosage ══════════ */
function nextWater(p){
  if(!p.lastWateredAt) return today();
  return dayKey(p.lastWateredAt + (p.waterEveryDays||7)*DAY);
}
function waterStatus(p){
  const d=Math.round((nextWater(p)-today())/DAY);
  if(d<0)  return {d,cls:'late',txt:d===-1?'En retard d\'un jour':'En retard de '+(-d)+' jours',ico:'💧'};
  if(d===0)return {d,cls:'soon',txt:"À arroser aujourd'hui",ico:'💧'};
  if(d===1)return {d,cls:'soon',txt:'Demain',ico:'💧'};
  return {d,cls:'ok',txt:'Dans '+d+' jours',ico:'💧'};
}
async function doWater(p){
  p.lastWateredAt=Date.now();
  p.journal=p.journal||[];
  p.journal.unshift({ts:Date.now(),type:'water'});
  if(p.journal.length>200) p.journal.length=200;
  await dbPut(p); await refresh();
  toast('💧 '+p.nickname+' arrosée');
}

/* ══════════ Photos ══════════
   Redimensionnement + JPEG : un cliche brut d'iPhone fait 3-5 Mo. */
function compress(file,max,q){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        let{width:w,height:h}=im;
        const k=Math.min(1,(max||900)/Math.max(w,h));
        w=Math.round(w*k); h=Math.round(h*k);
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(im,0,0,w,h);
        res(cv.toDataURL('image/jpeg',q||0.72));
      };
      im.onerror=()=>res(null);
      im.src=fr.result;
    };
    fr.onerror=()=>res(null);
    fr.readAsDataURL(file);
  });
}

/* ══════════ Vue : mes plantes ══════════ */
function careFor(p){
  if(!p.species) return null;
  const s=p.species.toLowerCase();
  return CARE.find(c=>s.includes(c.g.toLowerCase())||s.includes(c.lat.toLowerCase())||c.lat.toLowerCase().includes(s))||null;
}
function renderPlants(){
  const due=PLANTS.filter(p=>waterStatus(p).d<=0);
  const band=$('dueBand');
  if(!PLANTS.length){ band.style.display='none'; }
  else{
    band.style.display='block';
    band.classList.toggle('none',due.length===0);
    band.innerHTML = due.length
      ? '<div class="due-t">💧 '+due.length+' plante'+(due.length>1?'s':'')+' à arroser</div>'+
        '<div class="due-s">'+due.map(p=>esc(p.nickname)).join(' · ')+'</div>'
      : '<div class="due-t">✅ Tout est à jour</div><div class="due-s">Prochain arrosage '+
        (PLANTS.length?('dans '+Math.min(...PLANTS.map(p=>waterStatus(p).d))+' jours'):'—')+'</div>';
  }
  const list=PLANTS.slice().sort((a,b)=>{
    if(SET.sort==='name') return a.nickname.localeCompare(b.nickname);
    return nextWater(a)-nextWater(b);
  });
  const wrap=$('plantScroll'); wrap.innerHTML='';
  if(!list.length){
    wrap.innerHTML='<div class="empty">Aucune plante pour l\'instant.<br>Appuie sur <strong>+</strong> pour en ajouter une,<br>ou passe par l\'onglet <strong>Identifier</strong>.</div>';
    return;
  }
  list.forEach((p,i)=>{
    const st=waterStatus(p);
    const card=document.createElement('div');
    card.className='pcard'; card.style.animationDelay=Math.min(200,i*35)+'ms';
    const thumb=p.photo?'<img class="pthumb" src="'+p.photo+'" alt="">':'<div class="pthumb">🪴</div>';
    card.innerHTML=thumb+'<div class="pbody"><div class="pname">'+esc(p.nickname)+'</div>'+
      (p.species?'<div class="pspec">'+esc(p.species)+'</div>':'')+
      '<div class="pwater '+st.cls+'">'+st.ico+' '+st.txt+'</div></div>';
    const wb=document.createElement('button');
    wb.className='wbtn'+(st.d>1?' done':''); wb.innerHTML='💧'; wb.setAttribute('aria-label','Arroser');
    wb.addEventListener('click',e=>{e.stopPropagation();doWater(p);});
    card.appendChild(wb);
    card.addEventListener('click',()=>openPlant(p.id));
    wrap.appendChild(card);
  });
}

let editId=null, draftPhoto=null;
function openPlant(id){
  editId=id;
  const p=id?PLANTS.find(x=>x.id===id):null;
  draftPhoto=p?p.photo:null;
  const care=p?careFor(p):null;
  const b=$('plantSheetBody');
  b.innerHTML=
    '<div class="sh-t">'+(p?esc(p.nickname):'Nouvelle plante')+'</div>'+
    (p&&p.species?'<div class="sh-sub">'+esc(p.species)+'</div>':'<div style="height:10px"></div>')+
    '<div id="photoSlot"></div>'+
    '<div class="fld"><label>Surnom</label><input type="text" id="fNick" maxlength="40" placeholder="ex : Monsieur Monstera" value="'+(p?esc(p.nickname):'')+'"></div>'+
    '<div class="fld"><label>Espèce</label><input type="text" id="fSpec" maxlength="60" placeholder="ex : Monstera deliciosa" value="'+(p?esc(p.species||''):'')+'"></div>'+
    '<div class="fld-row">'+
      '<div class="fld"><label>Pièce</label><input type="text" id="fRoom" maxlength="30" placeholder="Salon" value="'+(p?esc(p.room||''):'')+'"></div>'+
      '<div class="fld"><label>Arroser tous les (jours)</label><input type="number" id="fEvery" min="1" max="120" value="'+(p?(p.waterEveryDays||7):7)+'"></div>'+
    '</div>'+
    '<div id="careSlot"></div>'+
    (p?'<div class="fld" style="margin-top:14px"><label>Notes</label><textarea id="fNotes" placeholder="Observations…">'+esc(p.notes||'')+'</textarea></div>':'')+
    (p&&p.journal&&p.journal.length?'<div class="slbl" style="padding:14px 4px 8px">Journal</div><div id="jrn"></div>':'')+
    '<div class="acts">'+
      (p?'<button class="btnw btn-g" id="waterNow">💧 J\'ai arrosé maintenant</button>':'')+
      '<button class="btnw btn-n" id="savePlant">Enregistrer</button>'+
      (p?'<button class="btnw btn-d" id="delPlant">Supprimer</button>':'')+
    '</div>';
  renderPhotoSlot();
  // La fiche se met a jour pendant la frappe, et propose la bonne frequence.
  const specIn=$('fSpec'), everyIn=$('fEvery');
  let everyTouched=!!p;
  everyIn.addEventListener('input',()=>{everyTouched=true;});
  function syncCare(){
    const c=careFor({species:specIn.value});
    const slot=$('careSlot');
    if(!c){slot.innerHTML='';return;}
    slot.innerHTML='<div class="care-grid">'+
      ci('Lumière',c.light)+ci('Arrosage conseillé',c.water+' j en été · '+c.winter+' j en hiver')+
      ci('Humidité',c.hum)+ci('Température',c.temp)+'</div>'+
      '<div class="note">💡 '+esc(c.tip)+'</div>';
    if(!everyTouched) everyIn.value=c.water;
  }
  specIn.addEventListener('input',syncCare);
  syncCare();
  if(p&&p.journal&&p.journal.length){
    const J={water:['💧','Arrosée'],fertilize:['🌱','Engrais'],repot:['🪴','Rempotée'],prune:['✂️','Taillée'],note:['📝','Note']};
    $('jrn').innerHTML=p.journal.slice(0,14).map(e=>{
      const k=J[e.type]||['•',e.type];
      const d=new Date(e.ts).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
      return '<div class="jrow"><span class="jico">'+k[0]+'</span><span class="jtxt">'+k[1]+(e.note?' — '+esc(e.note):'')+'</span><span class="jdate">'+d+'</span></div>';
    }).join('');
  }
  $('savePlant').addEventListener('click',savePlant);
  if(p){
    $('waterNow').addEventListener('click',()=>{doWater(p);closeSheets();});
    $('delPlant').addEventListener('click',async()=>{
      if(!confirm('Supprimer '+p.nickname+' ?'))return;
      await dbDel(p.id); closeSheets(); await refresh(); toast('Plante supprimée');
    });
  }
  openSheet('plantSheet');
}
function ci(k,v){return '<div class="care-i"><div class="care-k">'+k+'</div><div class="care-v">'+esc(v)+'</div></div>';}
function renderPhotoSlot(){
  const s=$('photoSlot');
  s.innerHTML = draftPhoto
    ? '<img class="sh-photo" src="'+draftPhoto+'" alt="">'
    : '<div class="sh-photo">🪴</div>';
  s.firstChild.addEventListener('click',()=>$('plantPhotoFile').click());
}
$('plantPhotoFile').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f)return;
  const d=await compress(f,900,.72);
  if(d){draftPhoto=d;renderPhotoSlot();}
  e.target.value='';
});
async function savePlant(){
  const nick=$('fNick').value.trim();
  if(!nick){toast('Donne-lui un surnom');return;}
  const base=editId?PLANTS.find(x=>x.id===editId):{id:uid(),createdAt:Date.now(),journal:[]};
  const p={...base,nickname:nick,species:$('fSpec').value.trim(),room:$('fRoom').value.trim(),
    waterEveryDays:Math.max(1,parseInt($('fEvery').value)||7),photo:draftPhoto,
    notes:$('fNotes')?$('fNotes').value.trim():(base.notes||'')};
  if(!p.lastWateredAt) p.lastWateredAt=Date.now();
  await dbPut(p); closeSheets(); await refresh(); toast('Enregistré');
}

const ORGANS=[['leaf','Feuille'],['flower','Fleur'],['fruit','Fruit'],['bark','Écorce']];
let idOrgan='leaf', idPhoto=null, idFile=null;
function renderOrgans(){
  $('organRow').innerHTML='';
  ORGANS.forEach(([k,n])=>{
    const b=document.createElement('button');
    b.className='organ'+(idOrgan===k?' sel':''); b.textContent=n;

    $('organRow').appendChild(b);

}
$('shotBox').addEventListener('click',()=>$('shotFile').click());
$('shotFile').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f)return;
  idFile=f;
  idPhoto=await compress(f,1100,.82);
  if(idPhoto) $('shotBox').innerHTML='<img src="'+idPhoto+'" alt="">';
  e.target.value='';
});
function dataURLtoBlob(d){
  const [h,b]=d.split(',');
  const mime=h.match(/:(.*?);/)[1];
  const bin=atob(b), u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  return new Blob([u],{type:mime});
}
$('idBtn').addEventListener('click',identify);
async function identify(){
  const out=$('idOut');
  if(!idPhoto){toast('Choisis d\'abord une photo');return;}
  if(!SET.plantnetKey){
    out.innerHTML='<div class="note"><strong>Clé PlantNet manquante.</strong><br>'+
      "L'identification passe par l'API de PlantNet, gratuite pour un usage personnel. "+
      "Crée un compte sur <strong>my.plantnet.org</strong>, copie ta clé, et colle-la dans l'onglet Réglages.</div>";
    return;
  }
  out.innerHTML='<div class="spin"></div><div style="text-align:center;color:var(--dim);font-size:13px;margin-top:12px">Analyse en cours…</div>';
  try{
    const fd=new FormData();
    fd.append('images',dataURLtoBlob(idPhoto),'photo.jpg');
    fd.append('organs',idOrgan);
    const url='https://my-api.plantnet.org/v2/identify/all?api-key='+encodeURIComponent(SET.plantnetKey)+'&nb-results=5&lang=fr';
    const r=await fetch(url,{method:'POST',body:fd});
    if(r.status===401||r.status===403){out.innerHTML=note('Clé refusée. Vérifie-la dans les Réglages.');return;}
    if(r.status===404){out.innerHTML=note("Aucune espèce reconnue. Réessaie avec une photo plus nette, ou change d'organe.");return;}
    if(r.status===429){out.innerHTML=note('Quota journalier atteint sur ta clé PlantNet. Réessaie demain.');return;}
    if(!r.ok){out.innerHTML=note('Erreur '+r.status+' côté PlantNet.');return;}
    const j=await r.json();
    renderResults(j.results||[]);
  }catch(err){
    out.innerHTML=note("Impossible de joindre PlantNet. Vérifie ta connexion — l'identification est la seule fonction qui a besoin d'internet.");
  }
}
function note(t){return '<div class="note">'+t+'</div>';}
function renderResults(rs){
  const out=$('idOut');
  if(!rs.length){out.innerHTML=note('Aucune correspondance trouvée.');return;}
  out.innerHTML='';
  rs.slice(0,5).forEach((r,i)=>{
    const sp=r.species||{};
    const lat=sp.scientificNameWithoutAuthor||'—';
    const com=(sp.commonNames||[])[0]||sp.genus||'';
    const pc=Math.round((r.score||0)*100);
    const d=document.createElement('div');
    d.className='res'; d.style.animationDelay=(i*50)+'ms';
    d.innerHTML='<div class="res-top"><div><div class="res-n">'+esc(com||lat)+'</div>'+
      '<div class="res-l">'+esc(lat)+(sp.family&&sp.family.scientificNameWithoutAuthor?' · '+esc(sp.family.scientificNameWithoutAuthor):'')+'</div></div>'+
      '<div class="res-p" style="color:'+(pc>60?'var(--leaf)':pc>25?'var(--soon)':'var(--dim)')+'">'+pc+'%</div></div>'+
      '<div class="res-bar"><div class="res-fill" style="width:0%"></div></div>';
    const add=document.createElement('button');
    add.className='btnw btn-n'; add.style.marginTop='11px'; add.textContent='+ Ajouter à ma collection';
    add.addEventListener('click',()=>{
      const care=CARE.find(c=>lat.toLowerCase().includes(c.g.toLowerCase()));
      openPlant(null);
      setTimeout(()=>{
        $('fNick').value=com||lat;
        $('fSpec').value=lat;
        if(care)$('fEvery').value=care.water;
        draftPhoto=idPhoto; renderPhotoSlot();
      },60);
    });
    d.appendChild(add);
    out.appendChild(d);
    setTimeout(()=>{d.querySelector('.res-fill').style.width=pc+'%';},60+i*50);
  });
}

/* ══════════ Fiches ══════════ */
function renderCare(q){
  q=(q||'').trim().toLowerCase();
  const list=CARE.filter(c=>!q||c.n.toLowerCase().includes(q)||c.lat.toLowerCase().includes(q)||c.g.toLowerCase().includes(q));
  const w=$('careList');
  if(!list.length){w.innerHTML='<div class="empty">Aucune fiche pour « '+esc(q)+' ».</div>';return;}
  w.innerHTML='';
  list.forEach(c=>{
    const d=document.createElement('div');
    d.className='fcard';
    d.innerHTML='<div class="femoji">'+c.e+'</div><div style="flex:1;min-width:0">'+
      '<div class="fname">'+esc(c.n)+'</div><div class="flat">'+esc(c.lat)+'</div>'+
      '<div class="fmeta"><span class="badge'+(c.diff.indexOf('facile')>=0||c.diff.indexOf('Très')>=0?' easy':'')+'">'+c.diff+'</span>'+
      '<span class="badge">💧 '+c.water+' j</span>'+
      (c.tox?'<span class="badge tox">☠️ '+TOX[c.tox]+'</span>':'')+'</div></div>';
    d.addEventListener('click',()=>openCare(c));
    w.appendChild(d);
  });
}
function openCare(c){
  $('careSheetBody').innerHTML=
    '<div class="sh-t">'+c.e+' '+esc(c.n)+'</div><div class="sh-sub">'+esc(c.lat)+'</div>'+
    '<div class="care-grid">'+
      ci('Lumière',c.light)+ci('Arrosage',c.water+' j en été · '+c.winter+' j en hiver')+
      ci('Humidité',c.hum)+ci('Température',c.temp)+
      ci('Difficulté',c.diff)+ci('Toxicité',TOX[c.tox])+
    '</div><div class="note">💡 '+esc(c.tip)+'</div>'+
    '<div class="acts"><button class="btnw btn-g" id="addFromCare">+ Ajouter à ma collection</button></div>';
  $('addFromCare').addEventListener('click',()=>{
    closeSheets();
    setTimeout(()=>{ openPlant(null);
      setTimeout(()=>{ $('fNick').value=c.n; $('fSpec').value=c.lat; $('fEvery').value=c.water; },60);
    },340);
  });
  openSheet('careSheet');
}
$('careSearch').addEventListener('input',e=>renderCare(e.target.value));

/* ══════════ Réglages ══════════ */
function renderSet(){
  const w=$('setScroll');
  w.innerHTML=
    '<div class="slbl">Identification</div>'+
    '<div class="fld"><label>Clé API PlantNet</label>'+
      '<input type="text" id="sKey" placeholder="colle ta clé ici" value="'+esc(SET.plantnetKey)+'"></div>'+
    '<div class="note">L\'identification par photo passe par <strong>PlantNet</strong>, gratuit pour un usage personnel. '+
      'Crée un compte sur <strong>my.plantnet.org</strong>, récupère ta clé et colle-la ci-dessus. '+
      'C\'est la <strong>seule fonction qui a besoin d\'internet</strong> — le reste de l\'app marche hors ligne.</div>'+
    '<div class="slbl">Rappels</div>'+
    '<div class="srow"><div><div class="srow-l">Notifications d\'arrosage</div>'+
      '<div class="srow-s">Prévient quand une plante a soif</div></div>'+
      '<label class="sw"><input type="checkbox" id="sNotify"'+(SET.notify?' checked':'')+'><span class="sl"></span></label></div>'+
    '<div class="note">⚠️ Sur iPhone, une app web fermée ne peut pas être réveillée sans serveur d\'envoi. '+
      'Les notifications ne partiront donc que si l\'app est <strong>ouverte ou récemment utilisée</strong>. '+
      'Le bandeau « à arroser » en haut de l\'écran reste le rappel fiable.</div>'+
    '<div class="slbl">Données</div>'+
    '<button class="btnw btn-n" id="expBtn">Exporter ma collection (JSON)</button>'+
    '<button class="btnw btn-n" id="impBtn">Importer un fichier</button>'+
    '<input type="file" id="impFile" accept="application/json" style="display:none">'+
    '<button class="btnw btn-d" id="wipeBtn">Tout effacer</button>'+
    '<div class="note" style="text-align:center">'+PLANTS.length+' plante'+(PLANTS.length>1?'s':'')+' · '+CARE.length+' fiches embarquées</div>';

  $('sKey').addEventListener('change',e=>{SET.plantnetKey=e.target.value.trim();saveSet();toast('Clé enregistrée');});
  $('sNotify').addEventListener('change',async e=>{
    if(e.target.checked && 'Notification' in window){
      const p=await Notification.requestPermission();
      if(p!=='granted'){e.target.checked=false;toast('Permission refusée');return;}
    }
    SET.notify=e.target.checked; saveSet();
  });
  $('expBtn').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify({plants:PLANTS,settings:SET},null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='plantes-'+new Date().toISOString().slice(0,10)+'.json';
    a.click(); URL.revokeObjectURL(a.href); toast('Export généré');
  });
  $('impBtn').addEventListener('click',()=>$('impFile').click());
  $('impFile').addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=async()=>{
      try{
        const d=JSON.parse(r.result);
        if(!Array.isArray(d.plants))throw 0;
        for(const p of d.plants) await dbPut(p);
        if(d.settings){SET={...SET,...d.settings};saveSet();}
        await refresh(); renderSet(); toast('Import terminé');
      }catch(err){toast('Fichier invalide');}
    };
    r.readAsText(f);
  });
  $('wipeBtn').addEventListener('click',async()=>{
    if(!confirm('Effacer toutes tes plantes ? Action irréversible.'))return;
    for(const p of PLANTS) await dbDel(p.id);
    await refresh(); renderSet(); toast('Tout a été effacé');
  });
}

/* Notification opportuniste : au lancement, si des plantes ont soif. */
function maybeNotify(){
  if(!SET.notify||!('Notification' in window)||Notification.permission!=='granted')return;
  const due=PLANTS.filter(p=>waterStatus(p).d<=0);
  if(!due.length)return;
  const k='notified_'+today();
  if(localStorage.getItem(k))return;
  localStorage.setItem(k,'1');
  try{ new Notification('💧 '+due.length+' plante'+(due.length>1?'s ont':' a')+' soif',
    {body:due.map(p=>p.nickname).join(', '),icon:'icon-192.png'}); }catch(e){}
}

/* ══════════ Navigation ══════════ */
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('hidden',v.id!==t.dataset.v));
  if(t.dataset.v==='vSet')renderSet();
  if(t.dataset.v==='vCare')renderCare($('careSearch').value);
  if(t.dataset.v==='vPlants')renderPlants();
}));
const backdrop=$('backdrop');
function openSheet(id){backdrop.classList.add('on');$(id).classList.add('on');}
function closeSheets(){backdrop.classList.remove('on');document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('on'));}
backdrop.addEventListener('click',closeSheets);

async function refresh(){ PLANTS=await dbAll(); renderPlants(); }

(async()=>{
  try{ await openDB(); }catch(e){ toast('Stockage indisponible'); }
  await refresh();
  renderOrgans(); renderCare('');
  maybeNotify();
})();

/* Enregistrement direct : ce script s'execute apres des await, donc l'evenement
   « load » est deja passe et s'y abonner ne declencherait jamais rien. */
if('serviceWorker' in navigator && location.protocol.startsWith('http'))
  navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
