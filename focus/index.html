<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Focus</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Focus">
<meta name="theme-color" content="#0b0d11">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0b0d11;
  --surf: #14171d;
  --surf2: #1c2029;
  --line: rgba(255,255,255,0.08);
  --text: #eef1f6;
  --dim: #7b8494;
  --focus: #ff6b4a;
  --short: #3ddc97;
  --long: #4aa8ff;
  --p1: #ff5c5c;
  --p2: #ffb020;
  --p3: #6b7686;
  --accent: var(--focus);
}
html, body {
  height: 100%; height: -webkit-fill-available;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden; -webkit-user-select: none; user-select: none;
  overscroll-behavior: none;
}
input, textarea { -webkit-user-select: text; user-select: text; }
button { font-family: inherit; -webkit-tap-highlight-color: transparent; cursor: pointer; }

/* ── Layout ───────────────────────────── */
.view {
  position: fixed; left: 0; right: 0;
  top: 0; bottom: 0;
  display: flex; flex-direction: column;
  padding-top: max(env(safe-area-inset-top), 44px);
  padding-bottom: calc(60px + max(env(safe-area-inset-bottom), 10px));
}
.view.hidden { display: none; }
.vhdr { padding: 2px 20px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-shrink: 0; }
.vhdr h1 { font-size: 27px; font-weight: 800; letter-spacing: -0.02em; }
.scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px 16px; }
.icon-btn {
  background: var(--surf); border: none; color: var(--dim);
  width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; transition: background 0.15s;
}
.icon-btn:active { background: var(--surf2); }
.icon-btn svg { width: 19px; height: 19px; }

/* ── Tab bar ──────────────────────────── */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: rgba(11,13,17,0.93);
  -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
  border-top: 1px solid var(--line);
  padding-bottom: max(env(safe-area-inset-bottom), 8px);
}
.tab {
  background: none; border: none; color: var(--dim);
  padding: 9px 0 5px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 10px; font-weight: 600; transition: color 0.18s;
}
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--accent); }

/* ── Timer ────────────────────────────── */
.mode-row { display: flex; gap: 6px; padding: 0 18px 14px; flex-shrink: 0; }
.mode-btn {
  flex: 1; padding: 9px 4px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surf);
  color: var(--dim); font-size: 12.5px; font-weight: 700; transition: all 0.2s;
}
.mode-btn.on { background: var(--accent); border-color: var(--accent); color: #0b0d11; }
.timer-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 20px; min-height: 0; }
.ring-wrap { position: relative; width: min(266px, 68vw); aspect-ratio: 1; flex-shrink: 1; }
.ring-wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.ring-bg { stroke: rgba(255,255,255,0.06); }
.ring-fill { stroke: var(--accent); stroke-linecap: round; transform-origin: 50% 50%; transform: rotate(-90deg); transition: stroke 0.45s, stroke-dashoffset 0.3s linear; }
.ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.big-time { font-size: clamp(50px, 16vw, 68px); font-weight: 300; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1; }
.ring-label { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; }
.dots { display: flex; gap: 7px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.16); transition: background 0.3s, transform 0.3s; }
.dot.done { background: var(--accent); }
.dot.now { background: var(--accent); transform: scale(1.45); }
.cur-task {
  width: 100%; max-width: 380px; padding: 13px 15px; border-radius: 15px;
  background: var(--surf); border: 1px solid var(--line);
  display: flex; align-items: center; gap: 11px; text-align: left; color: var(--text);
}
.cur-task:active { background: var(--surf2); }
.cur-task .ct-body { flex: 1; min-width: 0; }
.cur-task .ct-lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; color: var(--dim); text-transform: uppercase; }
.cur-task .ct-title { font-size: 15px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cur-task .ct-pom { font-size: 12px; color: var(--dim); flex-shrink: 0; font-variant-numeric: tabular-nums; }
.tctrl { display: flex; gap: 10px; align-items: center; width: 100%; max-width: 380px; padding: 0 0 6px; }
.tbtn { border: none; border-radius: 16px; font-size: 16px; font-weight: 700; padding: 16px 10px; transition: opacity 0.15s; }
.tbtn:active { opacity: 0.7; }
.tbtn-main { flex: 1; background: var(--accent); color: #0b0d11; }
.tbtn-side { flex: 0 0 56px; background: var(--surf); color: var(--text); font-size: 15px; }
.tbtn-side:disabled { opacity: 0.28; }
.today-strip { display: flex; justify-content: center; gap: 22px; font-size: 12px; color: var(--dim); flex-shrink: 0; padding-top: 2px; }
.today-strip b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }

/* ── Tasks ────────────────────────────── */
.proj-row { display: flex; gap: 7px; padding: 0 16px 12px; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
.proj-row::-webkit-scrollbar { display: none; }
.proj-pill {
  flex: 0 0 auto; padding: 7px 14px; border-radius: 20px;
  border: 1px solid var(--line); background: var(--surf); color: var(--dim);
  font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 7px; white-space: nowrap;
}
.proj-pill.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.proj-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.filter-row { display: flex; gap: 6px; padding: 0 16px 12px; flex-shrink: 0; }
.filt {
  flex: 1; padding: 7px 4px; border-radius: 10px; border: none;
  background: var(--surf); color: var(--dim); font-size: 12px; font-weight: 700; transition: all 0.18s;
}
.filt.on { background: var(--surf2); color: var(--text); }
.tgroup-lbl { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: var(--dim); text-transform: uppercase; padding: 14px 4px 8px; }
.task {
  display: flex; align-items: flex-start; gap: 12px; padding: 13px 14px;
  background: var(--surf); border-radius: 14px; margin-bottom: 8px;
  border: 1px solid transparent; transition: background 0.15s, opacity 0.2s;
}
.task:active { background: var(--surf2); }
.task.is-done { opacity: 0.42; }
.task.is-cur { border-color: var(--accent); }
.chk {
  width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0; margin-top: 1px;
  border: 2px solid var(--dim); background: none; display: flex; align-items: center; justify-content: center;
  transition: all 0.18s;
}
.chk.on { background: var(--accent); border-color: var(--accent); }
.chk svg { width: 13px; height: 13px; color: #0b0d11; opacity: 0; transition: opacity 0.15s; }
.chk.on svg { opacity: 1; }
.tbody { flex: 1; min-width: 0; }
.ttitle { font-size: 15px; font-weight: 600; line-height: 1.3; word-break: break-word; }
.task.is-done .ttitle { text-decoration: line-through; }
.tmeta { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin-top: 5px; font-size: 11.5px; color: var(--dim); }
.tmeta .mi { display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.prio-bar { width: 3px; align-self: stretch; border-radius: 3px; flex-shrink: 0; }
.due-late { color: var(--p1); font-weight: 700; }
.due-today { color: var(--p2); font-weight: 700; }
.sub-pill { font-size: 11px; color: var(--dim); }
.empty { text-align: center; color: var(--dim); padding: 46px 24px; font-size: 14px; line-height: 1.6; }
.fab {
  position: fixed; right: 18px; z-index: 45;
  bottom: calc(72px + max(env(safe-area-inset-bottom), 10px));
  width: 54px; height: 54px; border-radius: 50%; border: none;
  background: var(--accent); color: #0b0d11; font-size: 30px; font-weight: 300; line-height: 1;
  box-shadow: 0 8px 26px rgba(255,107,74,0.34);
  display: flex; align-items: center; justify-content: center;
}
.fab:active { transform: scale(0.92); }

/* ── Stats ────────────────────────────── */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 8px; }
.kpi { background: var(--surf); border-radius: 15px; padding: 15px; }
.kpi-v { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi-l { font-size: 11.5px; color: var(--dim); margin-top: 3px; font-weight: 600; }
.card { background: var(--surf); border-radius: 15px; padding: 15px; margin-top: 10px; }
.card-t { font-size: 13px; font-weight: 700; margin-bottom: 13px; display: flex; justify-content: space-between; align-items: center; }
.card-t span { font-size: 11.5px; color: var(--dim); font-weight: 600; }
.bars { display: flex; align-items: flex-end; gap: 4px; height: 116px; }
.barcol { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.bar { width: 100%; border-radius: 5px 5px 2px 2px; background: var(--accent); min-height: 3px; transition: height 0.35s; }
.bar.z { background: rgba(255,255,255,0.08); }
.barlbl { font-size: 9.5px; color: var(--dim); white-space: nowrap; overflow: hidden; }
.pbar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; }
.pbar-name { font-size: 13px; flex: 0 0 84px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.pbar-track { flex: 1; height: 8px; border-radius: 8px; background: rgba(255,255,255,0.07); overflow: hidden; }
.pbar-fill { height: 100%; border-radius: 8px; transition: width 0.4s; }
.pbar-v { font-size: 12px; color: var(--dim); flex: 0 0 52px; text-align: right; font-variant-numeric: tabular-nums; }
.heat { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; }
.hcell { aspect-ratio: 1; border-radius: 3px; background: rgba(255,255,255,0.06); }
.heat-lbls { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--dim); margin-top: 6px; }
.goal-wrap { margin-top: 12px; }
.goal-track { height: 9px; border-radius: 9px; background: rgba(255,255,255,0.07); overflow: hidden; }
.goal-fill { height: 100%; background: var(--accent); border-radius: 9px; transition: width 0.4s; }
.goal-lbl { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--dim); margin-top: 7px; font-variant-numeric: tabular-nums; }

/* ── Settings ─────────────────────────── */
.sec-lbl { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; color: var(--dim); text-transform: uppercase; padding: 20px 4px 9px; }
.srow {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--surf); padding: 13px 15px; border-radius: 13px; margin-bottom: 7px;
}
.srow-l { font-size: 14.5px; }
.srow-sub { font-size: 11.5px; color: var(--dim); margin-top: 2px; line-height: 1.4; }
.srow input[type=number] {
  width: 68px; background: var(--surf2); border: 1px solid var(--line); color: var(--text);
  padding: 8px; border-radius: 9px; font-size: 15px; text-align: center; font-family: inherit;
  font-variant-numeric: tabular-nums; -moz-appearance: textfield;
}
.srow input[type=number]::-webkit-outer-spin-button,
.srow input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.srow select {
  background: var(--surf2); border: 1px solid var(--line); color: var(--text);
  padding: 8px 10px; border-radius: 9px; font-size: 14px; font-family: inherit;
}
.srow input[type=range] { width: 118px; accent-color: var(--accent); }
.sw { position: relative; width: 48px; height: 29px; flex-shrink: 0; }
.sw input { opacity: 0; width: 0; height: 0; }
.sl { position: absolute; inset: 0; background: #3a3f4a; border-radius: 29px; transition: 0.25s; }
.sl::before { content: ''; position: absolute; height: 23px; width: 23px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.25s; }
.sw input:checked + .sl { background: var(--accent); }
.sw input:checked + .sl::before { transform: translateX(19px); }
.btn-w { width: 100%; padding: 14px; border: none; border-radius: 13px; font-size: 15px; font-weight: 700; margin-top: 7px; }
.btn-n { background: var(--surf2); color: var(--text); }
.btn-d { background: rgba(255,92,92,0.14); color: var(--p1); }
.accent-row { display: flex; gap: 9px; flex-wrap: wrap; }
.acc { width: 34px; height: 34px; border-radius: 50%; border: 2.5px solid transparent; }
    .acc.on { border-color: var(--text); }
    .audio-seg { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; background: var(--surf); padding: 5px; border-radius: 14px; }
    .audio-seg button {
      padding: 12px 6px; border: none; border-radius: 10px; background: transparent;
      color: var(--dim); font-size: 12.5px; font-weight: 700; font-family: inherit;
      transition: background 0.18s, color 0.18s;
    }
    .audio-seg button.sel { background: var(--accent); color: #0b0d11; }

/* ── Sheets ───────────────────────────── */
#backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 90;
  opacity: 0; pointer-events: none; transition: opacity 0.28s;
  -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
}
#backdrop.on { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
  background: #16191f; border-radius: 24px 24px 0 0;
  padding: 9px 18px calc(20px + max(env(safe-area-inset-bottom), 10px));
  transform: translateY(102%); transition: transform 0.33s cubic-bezier(0.32,0.72,0,1);
  max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
}
.sheet.on { transform: translateY(0); }
.grab { width: 38px; height: 4px; border-radius: 4px; background: #3a3f4a; margin: 0 auto 16px; }
.sheet-t { font-size: 18px; font-weight: 800; margin-bottom: 16px; }
.fld { margin-bottom: 13px; }
.fld label { display: block; font-size: 11.5px; color: var(--dim); margin-bottom: 6px; font-weight: 600; }
.fld input[type=text], .fld input[type=number], .fld input[type=date], .fld textarea, .fld select {
  width: 100%; background: var(--surf2); border: 1px solid var(--line); color: var(--text);
  padding: 12px 13px; border-radius: 11px; font-size: 15.5px; font-family: inherit;
}
.fld textarea { min-height: 68px; resize: vertical; line-height: 1.45; }
.fld-row { display: flex; gap: 10px; }
.fld-row .fld { flex: 1; }
.chips { display: flex; gap: 7px; flex-wrap: wrap; }
.chip {
  padding: 9px 14px; border-radius: 11px; border: 1px solid var(--line);
  background: var(--surf2); color: var(--dim); font-size: 13px; font-weight: 700; transition: all 0.18s;
}
.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip.on-p1 { background: var(--p1); border-color: var(--p1); color: #fff; }
.chip.on-p2 { background: var(--p2); border-color: var(--p2); color: #0b0d11; }
.subs { display: flex; flex-direction: column; gap: 7px; margin-top: 4px; }
.sub-i { display: flex; align-items: center; gap: 10px; background: var(--surf2); padding: 10px 12px; border-radius: 11px; }
.sub-i input[type=text] { flex: 1; background: none; border: none; color: var(--text); font-size: 14.5px; font-family: inherit; padding: 0; }
.sub-i .chk { width: 19px; height: 19px; border-radius: 6px; }
.sub-x { background: none; border: none; color: var(--dim); font-size: 19px; line-height: 1; padding: 0 3px; }
.sheet-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.pick-item {
  display: flex; align-items: center; gap: 11px; padding: 13px 14px;
  background: var(--surf2); border-radius: 12px; margin-bottom: 7px; text-align: left; width: 100%;
  border: 1px solid transparent; color: var(--text);
}
.pick-item.on { border-color: var(--accent); }
.pick-item .pi-t { flex: 1; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick-item .pi-p { font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(84px + max(env(safe-area-inset-bottom), 10px)); z-index: 200;
  background: var(--surf2); border: 1px solid var(--line); color: var(--text);
  padding: 11px 20px; border-radius: 13px; font-size: 13.5px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: opacity 0.25s, bottom 0.25s; white-space: nowrap;
}
.toast.on { opacity: 1; bottom: calc(94px + max(env(safe-area-inset-bottom), 10px)); }

.upd{position:fixed;left:12px;right:12px;z-index:220;
  bottom:calc(74px + max(env(safe-area-inset-bottom),8px));
  display:flex;align-items:center;gap:12px;background:#f5f5f7;color:#111;
  border-radius:15px;padding:12px 12px 12px 16px;box-shadow:0 10px 34px rgba(0,0,0,.55);
  /* sa hauteur + le decalage du bas, sinon le bandeau cache reste sur l'ecran */
  transform:translateY(calc(100% + 74px + max(env(safe-area-inset-bottom),8px) + 24px));
  opacity:0;pointer-events:none;
  transition:transform .38s cubic-bezier(.32,.72,0,1),opacity .28s ease}
.upd.on{transform:translateY(0);opacity:1;pointer-events:auto}
.upd-t{flex:1;font-size:14px;font-weight:700}
.upd-b{border:none;border-radius:10px;padding:9px 15px;background:#111;color:#fff;
  font-size:13.5px;font-weight:700;font-family:inherit;flex-shrink:0}
.app-ver{text-align:center;font-size:11px;opacity:.3;padding:16px 0 4px;letter-spacing:.06em}
@media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; } }
</style>
</head>
<body>

<!-- ══ TIMER ══ -->
<div class="view" id="vTimer">
  <div class="vhdr">
    <h1>Focus</h1>
    <button class="icon-btn" id="noiseBtn" aria-label="Sons d'ambiance">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
    </button>
  </div>
  <div class="mode-row">
    <button class="mode-btn" data-mode="focus">Focus</button>
    <button class="mode-btn" data-mode="short">Pause</button>
    <button class="mode-btn" data-mode="long">Pause longue</button>
  </div>
  <div class="timer-body">
    <div class="ring-wrap">
      <svg viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="54" fill="none" stroke-width="7"/>
        <circle class="ring-fill" id="ringFill" cx="60" cy="60" r="54" fill="none" stroke-width="7" stroke-dasharray="339.29" stroke-dashoffset="0"/>
      </svg>
      <div class="ring-center">
        <span class="big-time" id="bigTime">25:00</span>
        <span class="ring-label" id="ringLabel">Concentration</span>
        <div class="dots" id="dots"></div>
      </div>
    </div>
    <button class="cur-task" id="curTask">
      <div class="ct-body">
        <div class="ct-lbl">T&#226;che en cours</div>
        <div class="ct-title" id="ctTitle">Aucune &#8212; appuie pour choisir</div>
      </div>
      <span class="ct-pom" id="ctPom"></span>
    </button>
    <div class="tctrl">
      <button class="tbtn tbtn-side" id="tResetBtn" aria-label="R&#233;initialiser">&#8635;</button>
      <button class="tbtn tbtn-main" id="tMainBtn">D&#233;marrer</button>
      <button class="tbtn tbtn-side" id="tSkipBtn" aria-label="Passer">&#9197;</button>
    </div>
    <div class="today-strip">
      <span><b id="tdPom">0</b> pomodoros</span>
      <span><b id="tdTime">0min</b> aujourd'hui</span>
    </div>
  </div>
</div>

<!-- ══ TASKS ══ -->
<div class="view hidden" id="vTasks">
  <div class="vhdr">

<script>
/* ══════════════ Données ══════════════ */
const PCOLORS = ['#ff6b4a','#4aa8ff','#3ddc97','#c07bff','#ffb020','#ff5c8a','#2dd4bf','#8b95a5'];
const DEF_SET = {
  focusMin: 25, shortMin: 5, longMin: 15, longEvery: 4,
  autoBreak: true, autoFocus: false,
  alarm: true, tick: false, vibrate: true, wake: true,
  vol: 60, dailyGoal: 8, accent: '#ff6b4a', noise: 'none', noiseVol: 45
};
const K = 'focus_db_v1';
let DB = JSON.parse(localStorage.getItem(K) || 'null');
if (!DB) {
  DB = {
    projects: [
      { id: uid(), name: 'Perso',   color: '#4aa8ff', createdAt: Date.now() },
      { id: uid(), name: 'Travail', color: '#ff6b4a', createdAt: Date.now() }
    ],
    tasks: [], sessions: [], settings: { ...DEF_SET }
  };
  save();
}
DB.settings = { ...DEF_SET, ...(DB.settings || {}) };
DB.projects = DB.projects || []; DB.tasks = DB.tasks || []; DB.sessions = DB.sessions || [];
DB.tasks.forEach(t => {
  if (t.subtasks === undefined) t.subtasks = [];
  if (t.tags === undefined) t.tags = [];
  if (t.done === undefined) t.done = 0;
  if (t.est === undefined) t.est = 1;
  if (t.priority === undefined) t.priority = 3;
  if (t.repeat === undefined) t.repeat = 'none';
});

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function save() { localStorage.setItem(K, JSON.stringify(DB)); }
const S = () => DB.settings;
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function $(id) { return document.getElementById(id); }

/* ── Dates ── */
function dayKey(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x.getTime(); }
function today() { return dayKey(Date.now()); }
function isoDate(ts) { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function parseISO(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).getTime(); }
function fmtDur(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  if (h > 0) return h + 'h' + (m > 0 ? String(m).padStart(2, '0') : '');
  return m + 'min';
}
function fmtClock(sec) {
  sec = Math.max(0, Math.ceil(sec));
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}
function dueLabel(ts) {
  if (!ts) return null;
  const diff = Math.round((dayKey(ts) - today()) / 86400000);
  if (diff < 0) return { txt: diff === -1 ? 'Hier' : Math.abs(diff) + 'j de retard', cls: 'due-late' };
  if (diff === 0) return { txt: "Aujourd'hui", cls: 'due-today' };
  if (diff === 1) return { txt: 'Demain', cls: '' };
  if (diff < 7) return { txt: 'Dans ' + diff + 'j', cls: '' };
  return { txt: new Date(ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }), cls: '' };
}
function projOf(id) { return DB.projects.find(p => p.id === id) || null; }
function hexRgb(h) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(String(h || '#ff6b4a'));
  return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [255, 107, 74];
}

/* ══════════════ Audio ══════════════ */
/* ══════════ Moteur audio ══════════
   iOS impose un arbitrage entre deux sessions audio, et aucune ne fait tout :

   • Web Audio (oscillateurs) → session « ambiante » : se MELANGE a la musique
     d'une autre app, mais l'interrupteur silence la coupe entierement.
   • Element <audio>          → session « lecture media » : sonne malgre le
     silencieux, mais INTERROMPT la musique des autres apps.

   On expose donc les deux et on laisse le choix. Par defaut on melange, pour
   pouvoir s'entrainer en musique. Les deux moteurs jouent exactement les
   memes motifs, definis une seule fois dans SND_DEFS. */

const SND_DEFS = {
  tick: [{ f: 1180, d: 0.085, at: 0, v: 0.42, type: 'square' }],
  go:   [{ f: 784, d: 0.13, at: 0 }, { f: 1175, d: 0.22, at: 0.13 }],
  rest: [{ f: 587, d: 0.14, at: 0 }, { f: 392, d: 0.3, at: 0.14 }],
  half: [{ f: 988, d: 0.1, at: 0 }, { f: 988, d: 0.1, at: 0.14 }],
  done: [{ f: 523, d: 0.15, at: 0 }, { f: 659, d: 0.15, at: 0.16 },
         { f: 784, d: 0.15, at: 0.32 }, { f: 1046, d: 0.42, at: 0.48 }]
};

let audioMode = localStorage.getItem('audio_mode') || 'mix';   // 'mix' | 'solo'
let audioBlocked = false;
function setAudioMode(m) {
  if (m === audioMode) return;
  stopKeepAlive();
  audioMode = m;
  localStorage.setItem('audio_mode', m);
  initAudio();
}

/* ── Moteur « mix » : Web Audio, se superpose a la musique ── */
let AC = null;
function ctx() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function playCtx(name) {
  const c = ctx(); if (!c) return;
  const notes = SND_DEFS[name]; if (!notes) return;
  const t0 = c.currentTime + 0.012;
  notes.forEach(n => {
    try {
      const o = c.createOscillator(), g = c.createGain();
      o.connect(g); g.connect(c.destination);
      o.type = n.type || 'sine';
      o.frequency.setValueAtTime(n.f, t0 + n.at);
      const v = n.v == null ? 0.55 : n.v;
      g.gain.setValueAtTime(0.0001, t0 + n.at);
      g.gain.exponentialRampToValueAtTime(v, t0 + n.at + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + n.at + n.d);
      o.start(t0 + n.at); o.stop(t0 + n.at + n.d + 0.03);
    } catch (e) {}
  });
}

/* ── Moteur « solo » : WAV via <audio>, passe le silencieux ── */
function encodeWav(samples, rate) {
  const n = samples.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true);
  v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  let o = 44;
  for (let i = 0; i < n; i++) {
    const x = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7FFF, true); o += 2;
  }
  let bin = ''; const b = new Uint8Array(buf);
  for (let i = 0; i < b.length; i += 8192) bin += String.fromCharCode.apply(null, b.subarray(i, i + 8192));
  return 'data:audio/wav;base64,' + btoa(bin);
}
function synthWav(notes, rate) {
  rate = rate || 22050;
  const total = Math.max.apply(null, notes.map(n => n.at + n.d)) + 0.06;
  const N = Math.ceil(total * rate), s = new Float32Array(N);
  notes.forEach(n => {
    const st = Math.floor(n.at * rate), len = Math.floor(n.d * rate), vol = n.v == null ? 0.55 : n.v;
    for (let i = 0; i < len && st + i < N; i++) {
      const t = i / rate;
      const env = Math.min(1, t / 0.006) * Math.min(1, (len - i) / (0.01 * rate)) * Math.exp(-t * (2.2 / n.d));
      const w = n.type === 'square' ? (Math.sin(2 * Math.PI * n.f * t) >= 0 ? 1 : -1) : Math.sin(2 * Math.PI * n.f * t);
      s[st + i] += w * env * vol;
    }
  });
  let mx = 0; for (let i = 0; i < N; i++) mx = Math.max(mx, Math.abs(s[i]));
  if (mx > 0.95) { const k = 0.95 / mx; for (let i = 0; i < N; i++) s[i] *= k; }
  return encodeWav(s, rate);
}
const SND = {};
let keepEl = null, elementsReady = false;
function buildSounds() {
  if (SND.tick) return;
  Object.keys(SND_DEFS).forEach(k => {
    const uri = synthWav(SND_DEFS[k]);
    SND[k] = [new Audio(uri), new Audio(uri)];
    SND[k].forEach(a => { a.preload = 'auto'; a.load(); });
    SND[k].i = 0;
  });
  const n = 22050, s = new Float32Array(n);
  for (let i = 0; i < n; i++) s[i] = (Math.random() * 2 - 1) * 0.0006;
  keepEl = new Audio(encodeWav(s, 22050));
  keepEl.loop = true; keepEl.preload = 'auto'; keepEl.load();
}
function playEl(name) {
  buildSounds();
  const pool = SND[name]; if (!pool) return;
  const a = pool[pool.i % pool.length]; pool.i++;
  try { a.currentTime = 0; const p = a.play(); if (p && p.catch) p.catch(() => { audioBlocked = true; }); } catch (e) {}
}

/* iOS exige un geste utilisateur avant la premiere lecture. */
function initAudio() {
  if (audioMode === 'mix') { ctx(); return; }
  buildSounds();
  if (elementsReady) return;
  elementsReady = true;
  const all = Object.keys(SND).reduce((a, k) => a.concat(SND[k]), []).concat([keepEl]);
  all.forEach(a => {
    try {
      const p = a.play();
      if (p && p.then) p.then(() => { a.pause(); a.currentTime = 0; }).catch(() => {});
      else { a.pause(); a.currentTime = 0; }
    } catch (e) {}
  });
}

/* Maintien du lien Bluetooth : les ecouteurs coupent la liaison apres
   ~10-20 s de silence et mettent 200-500 ms a se reveiller. En mode mix on
   diffuse un souffle Web Audio (qui ne vole pas la session media). */
let keepNode = null;
function startKeepAlive() {
  if (audioMode === 'mix') {
    const c = ctx(); if (!c || keepNode) return;
    try {
      const buf = c.createBuffer(1, c.sampleRate, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.0008;
      const src = c.createBufferSource();
      src.buffer = buf; src.loop = true; src.connect(c.destination); src.start();
      keepNode = src;
    } catch (e) {}
    return;
  }
  buildSounds();
  if (keepEl) { try { const p = keepEl.play(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
}
function stopKeepAlive() {
  if (keepNode) { try { keepNode.stop(); } catch (e) {} keepNode = null; }
  if (keepEl) { try { keepEl.pause(); keepEl.currentTime = 0; } catch (e) {} }
}

function play(name) {
  audioBlocked = false;
  if (audioMode === 'mix') playCtx(name);
  else {
    buildSounds();
    const pool = SND[name]; if (!pool) return;
    const a = pool[pool.i % pool.length]; pool.i++;
    try { a.volume = Math.max(0, Math.min(1, S().vol / 100)); } catch (e) {}
    playEl(name);
  }
}
function alarmFocusEnd() { if (S().alarm) play('done'); }
function alarmBreakEnd()  { if (S().alarm) play('go'); }
function tickSound()      { if (S().tick)  play('tick'); }
function buzz(p) { if (S().vibrate && navigator.vibrate) navigator.vibrate(p); }

/* — Sons d'ambiance : WAV boucle via <audio>, donc audibles malgre le silencieux — */
const NOISES = [
  { id: 'none',  name: 'Aucun' },
  { id: 'white', name: 'Blanc' },
  { id: 'pink',  name: 'Rose' },
  { id: 'brown', name: 'Brun' },
  { id: 'rain',  name: 'Pluie' },
  { id: 'waves', name: 'Vagues' }
];
const noiseCache = {};

function makeNoise(kind, rate, secs) {
  rate = rate || 22050; secs = secs || 4;
  const n = rate * secs, d = new Float32Array(n);
  const base = kind === 'rain' ? 'white' : (kind === 'waves' ? 'brown' : kind);
  if (base === 'brown') {
    let last = 0;
    for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.5; }
  } else if (base === 'pink') {
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for (let i = 0; i < n; i++) {
      const w = Math.random() * 2 - 1;
      b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759; b2=0.96900*b2+w*0.1538520;
      b3=0.86650*b3+w*0.3104856; b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926;
    }
  } else {
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  }
  const cut = kind === 'rain' ? 1500 : (kind === 'waves' ? 700 : 9000);
  const al = Math.exp(-2 * Math.PI * cut / rate);
  let y = 0;
  for (let i = 0; i < n; i++) { y = (1 - al) * d[i] + al * y; d[i] = y; }
  if (kind === 'waves') for (let i = 0; i < n; i++) d[i] *= 0.45 + 0.55 * (0.5 - 0.5 * Math.cos(2 * Math.PI * (i / n) * 2));
  const f = Math.floor(rate * 0.25);
  for (let i = 0; i < f; i++) { const k = i / f; d[i] = d[i] * k + d[n - f + i] * (1 - k); }
  let mx = 0; for (let i = 0; i < n; i++) mx = Math.max(mx, Math.abs(d[i]));
  if (mx > 0) { const g = 0.75 / mx; for (let i = 0; i < n; i++) d[i] *= g; }
  return encodeWav(d, rate);
}

let noiseEl = null;
function stopNoise() {
  if (!noiseEl) return;
  try { noiseEl.pause(); noiseEl.currentTime = 0; } catch (e) {}
  noiseEl = null;
}
function startNoise(kind) {
  stopNoise();
  if (!kind || kind === 'none') return;
  // Un souffle continu vole la session media : incompatible avec le mode mix.
  if (audioMode === 'mix') { toast('Passe en « Priorité aux sons » pour les ambiances'); return; }
  if (!noiseCache[kind]) noiseCache[kind] = makeNoise(kind);
  noiseEl = new Audio(noiseCache[kind]);
  noiseEl.loop = true;
  noiseEl.volume = Math.max(0, Math.min(1, (S().noiseVol / 100) * 0.7));

/* — Wake lock — */
let wakeLock = null;
async function acquireWake() {
  if (!S().wake) return;
  try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
function releaseWake() { try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {} }

/* ══════════════ Minuteur Pomodoro ══════════════ */
const RING = 2 * Math.PI * 54;
let mode = 'focus', remain = S().focusMin * 60, endAt = 0, running = false, tInt = null;
let curTaskId = null, cycleCount = 0, sessionStart = 0;

function modeDur(m) { return (m === 'focus' ? S().focusMin : m === 'short' ? S().shortMin : S().longMin) * 60; }
function modeColor(m) { return m === 'focus' ? S().accent : m === 'short' ? '#3ddc97' : '#4aa8ff'; }
const MODE_LABEL = { focus: 'Concentration', short: 'Pause courte', long: 'Pause longue' };

function setMode(m, keepRunning) {
  mode = m;
  if (!keepRunning) { stopTimer(); remain = modeDur(m); }
  document.documentElement.style.setProperty('--accent', modeColor(m));
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('ringLabel').textContent = MODE_LABEL[m];
  renderTimer();
}
function renderTimer() {
  $('bigTime').textContent = fmtClock(remain);
  const d = modeDur(mode);
  $('ringFill').style.strokeDashoffset = String(RING * (1 - Math.max(0, remain) / d));
  $('tMainBtn').textContent = running ? 'Pause' : (remain < modeDur(mode) ? 'Reprendre' : 'Démarrer');
  renderDots(); renderCurTask(); renderTodayStrip();
}
function renderDots() {
  const n = Math.max(1, S().longEvery), w = $('dots');
  w.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < cycleCount % n ? ' done' : (i === cycleCount % n && mode === 'focus' ? ' now' : ''));
    w.appendChild(d);
  }
}
function renderCurTask() {
  const t = DB.tasks.find(x => x.id === curTaskId);
  $('ctTitle').textContent = t ? t.title : 'Aucune — appuie pour choisir';
  $('ctPom').textContent = t ? (t.done + '/' + (t.est || 0) + ' 🍅') : '';
}
function renderTodayStrip() {
  const ss = DB.sessions.filter(s => s.type === 'focus' && dayKey(s.end) === today());
  $('tdPom').textContent = ss.length;
  $('tdTime').textContent = fmtDur(ss.reduce((a, s) => a + s.dur, 0));
}
function startTimer() {
  initAudio();
  if (!running) {
    running = true;
    endAt = Date.now() + remain * 1000;
    if (mode === 'focus' && !sessionStart) sessionStart = Date.now();
    acquireWake(); startKeepAlive();
    tInt = setInterval(tick, 200);
    renderTimer();
  }
}
function pauseTimer() {
  running = false;
  clearInterval(tInt); tInt = null;
  remain = Math.max(0, (endAt - Date.now()) / 1000);
  releaseWake(); stopKeepAlive(); renderTimer();
}
function stopTimer() {
  running = false; clearInterval(tInt); tInt = null; releaseWake();
  // Le souffle de maintien s'arrete toujours : si un son d'ambiance tourne,
  // c'est lui qui garde la liaison Bluetooth ouverte.
  stopKeepAlive();
}
function resetTimer() { stopTimer(); remain = modeDur(mode); sessionStart = 0; renderTimer(); }
let lastTickSec = -1;
function tick() {
  remain = Math.max(0, (endAt - Date.now()) / 1000);
  const s = Math.ceil(remain);
  if (s !== lastTickSec) {
    lastTickSec = s;
    $('bigTime').textContent = fmtClock(remain);
    if (S().tick && running && s > 0) tickSound();
  }
  $('ringFill').style.strokeDashoffset = String(RING * (1 - remain / modeDur(mode)));
  if (remain <= 0) completePhase();
}
function completePhase() {
  stopTimer();
  if (mode === 'focus') {
    logSession(modeDur('focus'), true);
    cycleCount++;
    alarmFocusEnd(); buzz([90, 50, 90, 50, 160]);
    const nxt = (cycleCount % Math.max(1, S().longEvery) === 0) ? 'long' : 'short';
    setMode(nxt);
    toast(nxt === 'long' ? 'Pause longue méritée 🌿' : 'Pause 🌿');
    if (S().autoBreak) setTimeout(startTimer, 900);
  } else {
    alarmBreakEnd(); buzz([70, 40, 70]);
    setMode('focus');
    toast('Retour au focus 🎯');
    if (S().autoFocus) setTimeout(startTimer, 900);
  }
}
function logSession(durSec, completed) {
  const t = DB.tasks.find(x => x.id === curTaskId);
  DB.sessions.push({
    id: uid(), taskId: curTaskId, projectId: t ? t.projectId : null,
    start: sessionStart || (Date.now() - durSec * 1000), end: Date.now(),
    dur: Math.round(durSec), type: 'focus', completed: !!completed
  });
  if (t) { t.done = (t.done || 0) + 1; }
  sessionStart = 0;
  save(); renderTodayStrip(); renderTasks(); renderStats();
}
function skipPhase() {
  if (mode === 'focus') {
    const elapsed = modeDur('focus') - remain;
    if (elapsed > 60) logSession(elapsed, false);
    cycleCount++;
    const nxt = (cycleCount % Math.max(1, S().longEvery) === 0) ? 'long' : 'short';
    stopTimer(); setMode(nxt);
  } else { stopTimer(); setMode('focus'); }
}

$('tMainBtn').addEventListener('click', () => running ? pauseTimer() : startTimer());

function taskSort(a, b) {

  if (a.priority !== b.priority) return a.priority - b.priority;

function nextDue(ts, rep) {

/* ══════════════ Statistiques ══════════════ */
let statPeriod = 'day';
document.querySelectorAll('#vStats .filt').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#vStats .filt').forEach(x => x.classList.toggle('on', x === b));
  statPeriod = b.dataset.p; renderStats();
}));
function periodStart(p) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (p === 'day') return d.getTime();
  if (p === 'week') { const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return d.getTime(); }
  if (p === 'month') { d.setDate(1); return d.getTime(); }
  return 0;
}
function streakDays() {
  const days = new Set(DB.sessions.filter(s => s.type === 'focus').map(s => dayKey(s.end)));
  let n = 0, d = today();
  if (!days.has(d)) d -= 86400000;
  while (days.has(d)) { n++; d -= 86400000; }
  return n;
}
function renderStats() {
  const w = $('statScroll'); if (!w) return;
  const from = periodStart(statPeriod);
  const ss = DB.sessions.filter(s => s.type === 'focus' && s.end >= from);
  const totalSec = ss.reduce((a, s) => a + s.dur, 0);
  const doneTasks = DB.tasks.filter(t => t.completed && t.completedAt && t.completedAt >= from).length;

  let h = '';
  h += '<div class="kpis">' +
    kpi(fmtDur(totalSec), 'Temps de concentration') +
    kpi(ss.length, 'Pomodoros') +
    kpi(doneTasks, 'Tâches terminées') +
    kpi(streakDays() + ' j', 'Série en cours') +
    '</div>';

  // Objectif du jour
  const todayPom = DB.sessions.filter(s => s.type === 'focus' && dayKey(s.end) === today()).length;
  const goal = Math.max(1, S().dailyGoal);
  h += '<div class="card"><div class="card-t">Objectif du jour<span>' + todayPom + ' / ' + goal + '</span></div>' +
    '<div class="goal-track"><div class="goal-fill" style="width:' + Math.min(100, todayPom / goal * 100) + '%"></div></div>' +
    '<div class="goal-lbl"><span>' + (todayPom >= goal ? '🎉 Objectif atteint' : (goal - todayPom) + ' pomodoro' + (goal - todayPom > 1 ? 's' : '') + ' restant' + (goal - todayPom > 1 ? 's' : '')) + '</span>' +
    '<span>' + Math.round(Math.min(100, todayPom / goal * 100)) + '%</span></div></div>';

  // Histogramme
  const nDays = statPeriod === 'day' ? 1 : statPeriod === 'week' ? 7 : statPeriod === 'month' ? 30 : 14;
  if (statPeriod !== 'day') {
    const buckets = [];
    for (let i = nDays - 1; i >= 0; i--) {
      const dk = today() - i * 86400000;
      const v = DB.sessions.filter(s => s.type === 'focus' && dayKey(s.end) === dk).reduce((a, s) => a + s.dur, 0);
      buckets.push({ dk, v });
    }
    const max = Math.max(1, ...buckets.map(b => b.v));
    const step = nDays > 14 ? 5 : 1;
    h += '<div class="card"><div class="card-t">Temps par jour<span>max ' + fmtDur(max) + '</span></div><div class="bars">';
    buckets.forEach((b, i) => {
      const lbl = nDays <= 7
        ? new Date(b.dk).toLocaleDateString('fr-FR', { weekday: 'short' }).slice(0, 3)
        : (i % step === 0 ? new Date(b.dk).getDate() : '');
      h += '<div class="barcol"><div class="bar' + (b.v ? '' : ' z') + '" style="height:' + Math.max(3, b.v / max * 116) + 'px"></div><div class="barlbl">' + lbl + '</div></div>';
    });
    h += '</div></div>';
  }

  // Répartition par projet
  const byProj = {};
  ss.forEach(s => { const k = s.projectId || '_none'; byProj[k] = (byProj[k] || 0) + s.dur; });
  const entries = Object.entries(byProj).sort((a, b) => b[1] - a[1]);
  if (entries.length) {
    const max = Math.max(...entries.map(e => e[1]));
    h += '<div class="card"><div class="card-t">Par projet</div>';
    entries.forEach(([k, v]) => {
      const p = projOf(k);
      h += '<div class="pbar-row"><div class="pbar-name">' +
        '<span class="proj-dot" style="background:' + (p ? p.color : '#6b7686') + '"></span>' +
        esc(p ? p.name : 'Sans projet') + '</div>' +
        '<div class="pbar-track"><div class="pbar-fill" style="width:' + (v / max * 100) + '%;background:' + (p ? p.color : '#6b7686') + '"></div></div>' +
        '<div class="pbar-v">' + fmtDur(v) + '</div></div>';
    });
    h += '</div>';
  }

  // Distribution horaire
  const hours = new Array(24).fill(0);
  ss.forEach(s => { hours[new Date(s.end).getHours()] += s.dur; });
  const hmax = Math.max(1, ...hours);
  h += '<div class="card"><div class="card-t">Heures les plus productives</div><div class="heat">';
  const [ar, ag, ab] = hexRgb(S().accent);
  hours.forEach(v => {
    const o = v / hmax;
    const bg = v ? 'rgba(' + ar + ',' + ag + ',' + ab + ',' + (0.18 + o * 0.82).toFixed(3) + ')' : 'rgba(255,255,255,0.06)';
    h += '<div class="hcell" style="background:' + bg + '"></div>';
  });
  h += '</div><div class="heat-lbls"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>23h</span></div></div>';

  if (!ss.length) h += '<div class="empty">Aucune session sur cette période.<br>Lance un pomodoro pour commencer 🎯</div>';
  w.innerHTML = h;
}
function kpi(v, l) { return '<div class="kpi"><div class="kpi-v">' + v + '</div><div class="kpi-l">' + l + '</div></div>'; }

/* ══════════════ Réglages ══════════════ */
function renderSettings() {
  const w = $('setScroll'); if (!w) return;
  const s = S();
  const num = (id, val, min, max) => '<input type="number" id="' + id + '" value="' + val + '" min="' + min + '" max="' + max + '">';
  const sw = (id, on) => '<label class="sw"><input type="checkbox" id="' + id + '"' + (on ? ' checked' : '') + '><span class="sl"></span></label>';
  const row = (label, sub, ctrl) => '<div class="srow"><div><div class="srow-l">' + label + '</div>' + (sub ? '<div class="srow-sub">' + sub + '</div>' : '') + '</div>' + ctrl + '</div>';

  let h = '<div class="sec-lbl">Durées</div>';
  h += row('Concentration', 'minutes par pomodoro', num('sFocus', s.focusMin, 1, 180));
  h += row('Pause courte', 'minutes', num('sShort', s.shortMin, 1, 60));
  h += row('Pause longue', 'minutes', num('sLong', s.longMin, 1, 120));
  h += row('Pause longue tous les', 'pomodoros', num('sEvery', s.longEvery, 2, 12));

  h += '<div class="sec-lbl">Enchaînement</div>';
  h += row('Démarrer les pauses', 'automatiquement à la fin d\'un focus', sw('sAutoB', s.autoBreak));
  h += row('Démarrer le focus', 'automatiquement à la fin d\'une pause', sw('sAutoF', s.autoFocus));
  h += row('Objectif quotidien', 'pomodoros par jour', num('sGoal', s.dailyGoal, 1, 40));

  h += '<div class="sec-lbl">Sons & retours</div>';
  h += row('Alarme de fin', 'signal sonore à chaque transition', sw('sAlarm', s.alarm));
  h += row('Tic-tac', 'battement discret pendant le focus', sw('sTick', s.tick));
  h += row('Vibrations', '', sw('sVib', s.vibrate));
  h += row('Volume', '', '<input type="range" id="sVol" min="0" max="100" value="' + s.vol + '">');
  h += row('Écran allumé', 'empêche la mise en veille', sw('sWake', s.wake));
  h += '<div class="sec-lbl">Son &amp; musique</div>';
  h += '<div class="audio-seg" id="audioSeg"></div><div class="srow-sub" id="audioHint" style="padding:9px 4px 0"></div>';
  h += '<button class="btn-w btn-n" id="sTestBtn">🔊 Tester le son (écouteurs)</button>';

  h += '<div class="sec-lbl">Apparence</div>';
  h += '<div class="srow"><div><div class="srow-l">Couleur d\'accent</div></div><div class="accent-row" id="accRow"></div></div>';

  h += '<div class="sec-lbl">Données</div>';
  h += '<button class="btn-w btn-n" id="expBtn">Exporter mes données (JSON)</button>';
  h += '<button class="btn-w btn-n" id="impBtn">Importer un fichier</button>';
  h += '<input type="file" id="impFile" accept="application/json" style="display:none">';
  h += '<button class="btn-w btn-d" id="wipeBtn">Tout effacer</button>';
  h += '<div class="srow-sub" style="padding:14px 4px 0;text-align:center">' +
    DB.tasks.length + ' tâches · ' + DB.projects.length + ' projets · ' + DB.sessions.length + ' sessions</div>';
  w.innerHTML = h;

  const bindN = (id, key, min, max) => $(id).addEventListener('change', e => {
    const v = Math.min(max, Math.max(min, parseInt(e.target.value) || min));
    e.target.value = v; s[key] = v; save();
    if ((key === 'focusMin' && mode === 'focus') || (key === 'shortMin' && mode === 'short') || (key === 'longMin' && mode === 'long')) {
      if (!running) { remain = modeDur(mode); renderTimer(); }
    }
    renderDots();
  });
  bindN('sFocus', 'focusMin', 1, 180); bindN('sShort', 'shortMin', 1, 60);
  bindN('sLong', 'longMin', 1, 120); bindN('sEvery', 'longEvery', 2, 12);
  bindN('sGoal', 'dailyGoal', 1, 40);
  const bindS = (id, key) => $(id).addEventListener('change', e => { s[key] = e.target.checked; save(); });
  bindS('sAutoB', 'autoBreak'); bindS('sAutoF', 'autoFocus');
  bindS('sAlarm', 'alarm'); bindS('sTick', 'tick'); bindS('sVib', 'vibrate'); bindS('sWake', 'wake');
  $('sVol').addEventListener('input', e => { s.vol = +e.target.value; save(); });
  renderAudioSeg();
  $('sTestBtn').addEventListener('click', e => {
    startKeepAlive();
    const b = e.target, old = b.textContent;
    b.disabled = true; b.textContent = '♪ Écoute…';
    tickSound(); setTimeout(tickSound, 500);
    setTimeout(alarmFocusEnd, 1200);
    setTimeout(alarmBreakEnd, 2600);
    setTimeout(() => {
      b.textContent = old; b.disabled = false;
      if (!running) stopKeepAlive();
    }, 4000);
  });

  const ar = $('accRow');
  PCOLORS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'acc' + (s.accent === c ? ' on' : ''); b.style.background = c;
    b.addEventListener('click', () => { s.accent = c; save(); setMode(mode, true); renderSettings(); });
    ar.appendChild(b);
  });

  $('expBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'focus-' + isoDate(Date.now()) + '.json';
    a.click(); URL.revokeObjectURL(a.href);
    toast('Export généré');
  });
  $('impBtn').addEventListener('click', () => $('impFile').click());
  $('impFile').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d.tasks || !d.projects) throw 0;
        DB = { ...DB, ...d };
        DB.settings = { ...DEF_SET, ...(DB.settings || {}) };
        save(); location.reload();
      } catch (err) { toast('Fichier invalide'); }
    };
    r.readAsText(f);
  });
  $('wipeBtn').addEventListener('click', () => {
    if (!confirm('Effacer toutes les tâches, projets et statistiques ? Action irréversible.')) return;
    localStorage.removeItem(K); location.reload();
  });
}

/* Choix du mode audio : mélanger avec la musique, ou prendre la main. */
const AUDIO_CHOICES = [
  { id: 'mix',  name: '🎵 Avec ma musique',
    hint: "Les sons se superposent à ta musique sans la couper. Nécessite que l'interrupteur silence de l'iPhone soit désactivé. Les sons d'ambiance restent indisponibles dans ce mode." },
  { id: 'solo', name: '🔔 Priorité aux sons',
    hint: "Sons toujours audibles, même iPhone en silencieux, et sons d'ambiance disponibles — mais ta musique se met en pause." }
];
function renderAudioSeg() {
  const seg = $('audioSeg'), hint = $('audioHint');
  if (!seg) return;
  seg.innerHTML = '';
  AUDIO_CHOICES.forEach(ch => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = ch.name;
    b.classList.toggle('sel', audioMode === ch.id);
    b.addEventListener('click', () => {
      if (ch.id === 'mix') { stopNoise(); S().noise = 'none'; save(); }
      setAudioMode(ch.id); renderAudioSeg();
    });
    seg.appendChild(b);
  });
  const cur = AUDIO_CHOICES.find(c => c.id === audioMode);
  if (hint) hint.textContent = cur ? cur.hint : '';
}

/* ══════════════ Sons d'ambiance ══════════════ */
$('noiseBtn').addEventListener('click', () => {
  const w = $('noiseChips'); w.innerHTML = '';
  NOISES.forEach(n => {
    const b = document.createElement('button');
    b.className = 'chip' + (S().noise === n.id ? ' on' : ''); b.type = 'button'; b.textContent = n.name;
    b.addEventListener('click', () => {
      S().noise = n.id; save(); startNoise(n.id);
      w.querySelectorAll('.chip').forEach((x, i) => x.classList.toggle('on', NOISES[i].id === n.id));
    });
    w.appendChild(b);
  });
  $('noiseVol').value = S().noiseVol;
  openSheet('noiseSheet');
});
$('noiseVol').addEventListener('input', e => { S().noiseVol = +e.target.value; setNoiseVol(+e.target.value); save(); });

/* ══════════════ Démarrage ══════════════ */
document.documentElement.style.setProperty('--accent', S().accent);
setMode('focus');
renderTasks();
renderTimer();
document.addEventListener('touchstart', initAudio, { passive: true, once: true });
document.addEventListener('click', initAudio, { once: true });

/* Le service worker sert d'abord le cache : une nouvelle version n'apparaissait
   qu'au lancement suivant, sans que rien ne le signale. */
const APP_VERSION = 'Focus v7';
(function(){
  const v = document.getElementById('appVer');
  if (v) v.textContent = APP_VERSION;
  if (!('serviceWorker' in navigator) || !location.protocol.startsWith('http')) return;
  const banner = document.getElementById('updBanner');
  const showUpdate = () => banner && banner.classList.add('on');
  const btn = document.getElementById('updBtn');
  if (btn) btn.addEventListener('click', () => location.reload());
  const avaitControleur = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').then(reg => {
    if (reg.waiting && avaitControleur) showUpdate();
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing; if (!nw) return;
      nw.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdate();
      });
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') reg.update().catch(()=>{});
    });
    setTimeout(() => reg.update().catch(()=>{}), 3000);
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (avaitControleur) showUpdate();
  });
})();

window.addEventListener('beforeunload', () => { if (running && mode === 'focus') { /* la session en cours n'est pas comptée */ } });
</script>
